name: Offline checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-optional.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: bash -n install.sh start_prod.sh setup_nginx.sh
      - run: node --check web/static/app.js
      - run: node --check web/static/ui.js
      - run: node --check web/static/premium.js
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: git diff --exit-code -- web/static/vendor
      - run: npm run check
      - run: npm run format:check
